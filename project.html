<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio | Project</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="./index.html">
          <img src="./images/logo.svg" height="30" alt="Logo" />
        </a>

        <div class="collapse navbar-collapse">
          <div class="navbar-nav ms-4">
            <a class="nav-link fw-semibold" href="./index.html">Home</a>
            <a class="nav-link active" href="./project.html">My Project</a>
          </div>
        </div>

        <button class="btn btn-contact-nav">Contact Me</button>
      </div>
    </nav>

    <!-- Form -->
    <section class="py-5">
      <div class="container">
        <div class="contact-wrapper mx-auto">
          <h3 class="text-center fw-bold mb-4">GET IN TOUCH</h3>

          <form>
            <div class="mb-3">
              <label class="form-label fw-medium">Name</label>
              <input type="text" class="form-control custom-input" />
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Email</label>
              <input type="email" class="form-control custom-input" />
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Phone Number</label>
              <input type="text" class="form-control custom-input" />
            </div>

            <div class="mb-3">
              <label class="form-label fw-medium">Subject</label>
              <select class="form-select custom-input">
                <option selected hidden></option>
                <option>Web Development</option>
                <option>UI / UX Design</option>
                <option>Machine learning</option>
              </select>
            </div>

            <div class="mb-4">
              <label class="form-label fw-medium">Your Message</label>
              <textarea rows="5" class="form-control custom-input"></textarea>
            </div>

            <div class="text-end">
              <button type="submit" class="btn btn-submit">submit</button>
            </div>
          </form>
        </div>
      </div>
    </section>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
