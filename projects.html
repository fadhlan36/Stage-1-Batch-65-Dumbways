<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Portfolio</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/project.css">
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white">
      <div class="container">
        <a class="navbar-brand" href="index.html">
          <img src="./images/logo.svg" alt="Logo" class="logo-img" />
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="projects.html">My Project</a>
            </li>
          </ul>
          <button class="btn btn-dark btn-sm contact-btn">Contact Me</button>
        </div>
      </div>
    </nav>

    <!-- Form Section - Full Width -->
    <div class="form-section">
      <div class="container">
        <div class="form-wrapper">
          <h2 class="text-center">ADD MY PROJECT</h2>
          <form id="projectForm">
            <div class="mb-3">
              <label class="form-label">Project Name</label>
              <input
                type="text"
                class="form-control"
                id="projectName"
                required
              />
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Start Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="startDate"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">End Date</label>
                <input type="date" class="form-control" id="endDate" required />
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea
                class="form-control"
                id="description"
                required
              ></textarea>
            </div>

            <div class="mb-3">
              <label class="form-label">Technologies</label>
              <div class="row">
                <div class="col-6 col-md-3 mb-2">
                  <div class="form-check">
                    <input
                      class="form-check-input tech-check"
                      type="checkbox"
                      value="Node Js"
                    />
                    <label class="form-check-label">Node Js</label>
                  </div>
                </div>
                <div class="col-6 col-md-3 mb-2">
                  <div class="form-check">
                    <input
                      class="form-check-input tech-check"
                      type="checkbox"
                      value="Next Js"
                    />
                    <label class="form-check-label">Next Js</label>
                  </div>
                </div>
                <div class="col-6 col-md-3 mb-2">
                  <div class="form-check">
                    <input
                      class="form-check-input tech-check"
                      type="checkbox"
                      value="React Js"
                    />
                    <label class="form-check-label">React Js</label>
                  </div>
                </div>
                <div class="col-6 col-md-3 mb-2">
                  <div class="form-check">
                    <input
                      class="form-check-input tech-check"
                      type="checkbox"
                      value="TypeScript"
                    />
                    <label class="form-check-label">TypeScript</label>
                  </div>
                </div>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Upload Image</label>
              <input
                type="file"
                class="form-control"
                id="imageUpload"
                accept="image/*"
              />
            </div>

            <div class="text-end">
              <button type="submit" class="submit-btn">submit</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Projects Section -->
    <div class="container">
      <div class="projects-section">
        <h2 class="text-center">MY PROJECT</h2>

        <!-- Filter Section -->
        <div class="mb-4 text-center">
          <button
            class="btn btn-sm btn-dark me-2 mb-2"
            onclick="filterProjects('all')"
          >
            All
          </button>
          <button
            class="btn btn-sm btn-outline-dark me-2 mb-2"
            onclick="filterProjects('Node Js')"
          >
            Node Js
          </button>
          <button
            class="btn btn-sm btn-outline-dark me-2 mb-2"
            onclick="filterProjects('Next Js')"
          >
            Next Js
          </button>
          <button
            class="btn btn-sm btn-outline-dark me-2 mb-2"
            onclick="filterProjects('React Js')"
          >
            React Js
          </button>
          <button
            class="btn btn-sm btn-outline-dark me-2 mb-2"
            onclick="filterProjects('TypeScript')"
          >
            TypeScript
          </button>
        </div>

        <div
          class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4"
          id="projectsGrid"
        ></div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->
    <script src="./js/script.js">
    </script>
  </body>
</html>
